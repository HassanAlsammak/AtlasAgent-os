[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasagent-os"
version = "0.3.0"
description = "A small, auditable, permission-aware multi-agent task runner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AtlasAgent OS contributors"}]
keywords = ["agents", "orchestration", "open-source"]

[project.optional-dependencies]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.package-data]
atlasagent = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.packages.find]
include = ["atlasagent*"]
